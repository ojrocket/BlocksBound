<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420">
  <rect width="100%" height="100%" fill="#050505" rx="10"/>
  
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#111" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2ff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#00f2ff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#00f2ff;stop-opacity:0" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#grid)" rx="10"/>

  <style>
    @keyframes scan {
      0% { transform: translateY(-100px); }
      100% { transform: translateY(420px); }
    }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; text-transform: uppercase; }
    .header { fill: #00f2ff; font-size: 18px; font-weight: 900; letter-spacing: 3px; }
    .tag { fill: #555; font-size: 9px; font-weight: bold; letter-spacing: 1px; }
    .tech { fill: #fff; font-size: 14px; font-weight: 700; }
    .role { fill: #00f2ff; font-size: 11px; opacity: 0.8; }
    .line { stroke: #00f2ff; stroke-width: 1; opacity: 0.3; }
  </style>

  <!-- Scanning Line -->
  <rect width="600" height="100" fill="url(#glow)">
    <animateTransform attributeName="transform" type="translate" from="0,-100" to="0,420" dur="4s" repeatCount="indefinite" />
  </rect>

  <g transform="translate(40, 50)">
    <text x="0" y="0" class="mono header">SYSTEM_STACK // INITIALIZED</text>
    <line x1="0" y1="15" x2="520" y2="15" class="line" />

    <!-- 01: CORE -->
    <g transform="translate(0, 50)">
      <text x="0" y="0" class="mono tag">[ MODULE_01: ENGINE_CORE ]</text>
      <text x="0" y="22" class="mono tech">JAVA 21 LTS + LWJGL 3</text>
      <text x="0" y="38" class="mono role">RENDERER: OPENGL 4.6 // MATH: JOML</text>
      <path d="M 0 45 L 520 45" class="line" stroke-dasharray="2,2" />
    </g>

    <!-- 02: DATA -->
    <g transform="translate(0, 120)">
      <text x="0" y="0" class="mono tag">[ MODULE_02: PERSISTENCE ]</text>
      <text x="0" y="22" class="mono tech">MYSQL SERVER + JDBC</text>
      <text x="0" y="38" class="mono role">PROTOCOL: TCP/IP // STORAGE: RELATIONAL</text>
      <path d="M 0 45 L 520 45" class="line" stroke-dasharray="2,2" />
    </g>

    <!-- 03: BUILD -->
    <g transform="translate(0, 190)">
      <text x="0" y="0" class="mono tag">[ MODULE_03: AUTOMATION ]</text>
      <text x="0" y="22" class="mono tech">GRADLE + GIT + GITHUB</text>
      <text x="0" y="38" class="mono role">CI/CD: GITHUB ACTIONS // VCS: DISTRIBUTED</text>
      <path d="M 0 45 L 520 45" class="line" stroke-dasharray="2,2" />
    </g>

    <!-- 04: DEV -->
    <g transform="translate(0, 260)">
      <text x="0" y="0" class="mono tag">[ MODULE_04: ENVIRONMENT ]</text>
      <text x="0" y="22" class="mono tech">INTELLIJ IDEA + GLFW</text>
      <text x="0" y="38" class="mono role">IDE: JETBRAINS // WINDOWING: NATIVE_OS</text>
      <path d="M 0 45 L 520 45" class="line" stroke-dasharray="2,2" />
    </g>

    <!-- 05: FUTURE -->
    <g transform="translate(0, 330)">
      <text x="0" y="0" class="mono tag">[ MODULE_05: EXTENSIONS ]</text>
      <text x="0" y="20" class="mono role" style="fill:#555">OPENAL // STB_IMAGE // ASSET_PIPELINE</text>
    </g>
  </g>

  <!-- Corner Brackets -->
  <path d="M 20 20 L 40 20 M 20 20 L 20 40" fill="none" stroke="#00f2ff" stroke-width="2" />
  <path d="M 560 20 L 580 20 M 580 20 L 580 40" fill="none" stroke="#00f2ff" stroke-width="2" />
  <path d="M 20 400 L 20 380 M 20 400 L 40 400" fill="none" stroke="#00f2ff" stroke-width="2" />
  <path d="M 580 400 L 580 380 M 580 400 L 560 400" fill="none" stroke="#00f2ff" stroke-width="2" />
</svg>
